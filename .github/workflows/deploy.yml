name: Desplegar el sitio

on:
  push:
    branches: [main]
  # Reconstruye a diario para que los repositorios nuevos aparezcan en el
  # portafolio sin que nadie tenga que tocar el sitio.
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; si llega uno nuevo, el anterior se descarta.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Construir con Astro
        uses: withastro/action@v3
        env:
          # Sube el limite de peticiones a la API de GitHub de 60 a 1000 por hora.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
